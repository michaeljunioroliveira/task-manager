<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
        }

        /* Formulário */
        .form-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 600px;
            margin: 0 auto 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-card h2 {
            margin-bottom: 1rem;
            color: #444;
            font-size: 1rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn-criar {
            background: #4CAF50;
            color: white;
            width: 100%;
        }

        .btn-criar:hover { background: #45a049; }

        /* Lista de tasks */
        .tasks-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .task-card {
            background: white;
            border-radius: 8px;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .task-card.done {
            opacity: 0.6;
        }

        .task-info { flex: 1; }

        .task-title {
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .task-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
        }

        .task-status {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-DONE    { background: #d1e7dd; color: #0f5132; }

        .task-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .btn-done   { background: #0d6efd; color: white; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-done:hover   { background: #0b5ed7; }
        .btn-delete:hover { background: #bb2d3b; }

        .empty {
            text-align: center;
            color: #999;
            padding: 2rem;
        }
    </style>
</head>
<body>

<h1>📋 Task Manager</h1>

<!-- Formulário de criar task -->
<div class="form-card">
    <h2>Nova Task</h2>
    <input type="text" id="titulo" placeholder="Título da task" />
    <textarea id="descricao" rows="2" placeholder="Descrição (opcional)"></textarea>
    <button class="btn-criar" onclick="criarTask()">+ Criar Task</button>
</div>

<!-- Lista de tasks -->
<div class="tasks-container" id="lista-tasks">
    <p class="empty">Carregando tasks...</p>
</div>

<script>
    const API = 'http://localhost:8080/tasks';

    // Busca e renderiza todas as tasks
    async function carregarTasks() {
        const lista = document.getElementById('lista-tasks');

        const response = await fetch(API);
        const tasks = await response.json();

        if (tasks.length === 0) {
            lista.innerHTML = '<p class="empty">Nenhuma task cadastrada ainda.</p>';
            return;
        }

        lista.innerHTML = tasks.map(task => `
            <div class="task-card ${task.status === 'DONE' ? 'done' : ''}">
                <div class="task-info">
                    <p class="task-title">${task.title}</p>
                    <p class="task-desc">${task.description || ''}</p>
                    <span class="task-status status-${task.status}">
                        ${task.status === 'DONE' ? '✅ Concluída' : '⏳ Pendente'}
                    </span>
                </div>
                <div class="task-actions">
                    ${task.status === 'PENDING' ? `
                        <button class="btn-done" onclick="concluirTask(${task.id})">Concluir</button>
                    ` : ''}
                    <button class="btn-delete" onclick="deletarTask(${task.id})">Deletar</button>
                </div>
            </div>
        `).join('');
    }

    // POST — criar nova task
    async function criarTask() {
        const titulo = document.getElementById('titulo').value.trim();
        const descricao = document.getElementById('descricao').value.trim();

        if (!titulo) {
            alert('O título é obrigatório!');
            return;
        }

        await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: titulo,
                description: descricao,
                status: 'PENDING'
            })
        });

        // Limpa o formulário e recarrega a lista
        document.getElementById('titulo').value = '';
        document.getElementById('descricao').value = '';
        carregarTasks();
    }

    // PUT — marcar como DONE
    async function concluirTask(id) {
        const response = await fetch(`${API}/${id}`);
        const task = await response.json();

        await fetch(`${API}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...task, status: 'DONE' })
        });

        carregarTasks();
    }

    // DELETE — deletar task
    async function deletarTask(id) {
        if (!confirm('Tem certeza que quer deletar essa task?')) return;

        await fetch(`${API}/${id}`, { method: 'DELETE' });
        carregarTasks();
    }

    // Carrega as tasks ao abrir a página
    carregarTasks();
</script>

</body>
</html>
